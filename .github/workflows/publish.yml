name: Publish to PyPI

on:
  release:
    types: [published]
  # Nightly dev build of main (e.g. 0.3.0rc2.dev202611120200), installable with `pip install --pre solwa`.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  publish:
    # Nightlies only from main; releases from their tag.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the nightly checks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set nightly version
        id: nightly
        if: github.event_name != 'release'
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
            echo "::error::v$base is already released, so $base.devN would sort before it. Bump main to the next version (see RELEASING.md)."
            exit 1
          fi
          if [ "${{ github.event_name }}" = schedule ] && [ -z "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "No new commits on main, skipping nightly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v="$base.dev$(date -u +%Y%m%d%H%M)"
          sed -i "s/^version = \".*\"/version = \"$v\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$v\"/" src/solwa/__init__.py
          echo "Nightly version: $v"

      - name: Run CPU tests
        if: github.event_name != 'release' && steps.nightly.outputs.skip != 'true'
        run: |
          pip install . pytest
          python -m pytest tests/ --device=cpu -q

      - name: Install build tools
        if: steps.nightly.outputs.skip != 'true'
        run: pip install build twine

      - name: Build package
        if: steps.nightly.outputs.skip != 'true'
        run: python -m build

      - name: Validate distributions
        if: steps.nightly.outputs.skip != 'true'
        run: twine check dist/*

      - name: Publish to PyPI
        if: steps.nightly.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
