name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          pip install ruff black

      - name: Ruff
        run: ruff check src/solwa --select E4,E7,E9,F

      - name: Black
        run: black --check --diff src/solwa

